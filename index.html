<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>BRAWL STARS MARKET</title>
<style>
:root{--ink:#111;--muted:#666;--line:#e8e8e8;--gold:#ffc928;--soft:#fff8df}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,Arial,sans-serif;padding-bottom:90px}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;background:#fffffff2;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px max(16px,calc((100% - 1100px)/2));backdrop-filter:blur(12px)}.brand{font-weight:1000;letter-spacing:-1px;font-size:20px}.brand small{display:block;font-size:10px;letter-spacing:3px;color:#777;margin-top:3px}.mark{display:inline-grid;place-items:center;width:39px;height:39px;border-radius:12px;background:var(--gold);margin-right:8px}.actions{display:flex;gap:8px}.icon{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;color:#111}.hero{max-width:1100px;margin:22px auto 0;padding:28px 22px;border-radius:24px;background:linear-gradient(110deg,#fff5cf,#fff 55%,#f3f3f3);display:flex;align-items:center;justify-content:space-between;gap:20px}.hero h1{font-size:clamp(30px,6vw,54px);line-height:.95;margin:9px 0 12px;letter-spacing:-2px}.hero p{color:#555;max-width:490px;line-height:1.5}.hero-art{font-size:clamp(75px,15vw,140px);filter:drop-shadow(0 12px 10px #0002)}.tag{font-size:11px;font-weight:900;letter-spacing:2px}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.head h2{margin:0;font-size:25px}.tools{display:flex;gap:8px;flex-wrap:wrap}.field{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;color:#111;min-width:0}.search{width:min(100%,280px)}.filters{display:flex;gap:8px;overflow:auto;padding:15px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:30px;padding:9px 14px;white-space:nowrap}.chip.active{background:#111;color:#fff;border-color:#111}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #0000000d}.pic{height:160px;display:grid;place-items:center;background:linear-gradient(145deg,var(--c1),var(--c2));font-size:70px}.info{padding:13px}.kind{color:#777;font-size:11px}.info h3{font-size:15px;margin:6px 0 12px}.buyrow{display:flex;align-items:center;justify-content:space-between;gap:8px}.price{font-weight:1000;font-size:18px}.btn{border:0;border-radius:11px;padding:10px 13px;background:#111;color:#fff;font-weight:800}.btn.gold{background:var(--gold);color:#111}.btn.light{background:#f3f3f3;color:#111}.btn:disabled{opacity:.45;cursor:not-allowed}.empty{padding:40px;text-align:center;color:#777;grid-column:1/-1}.panel{border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:20px}.panel h3{margin-top:0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.cartline,.orderline{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.cartline:last-child{border:0}.qty{display:flex;align-items:center;gap:8px}.qty button{border:1px solid var(--line);background:#fff;border-radius:8px;width:28px;height:28px}.bottom{position:fixed;z-index:6;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:9px 6px calc(9px + env(safe-area-inset-bottom))}.bottom button{background:none;border:0;padding:7px 14px;color:#555;font-size:12px}.bottom button.active{color:#111;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.dialog{background:#fff;border-radius:20px;padding:20px;width:min(100%,470px);max-height:90vh;overflow:auto}.dialog h3{margin-top:0}.dialog input,.dialog select,.dialog textarea{width:100%;margin:6px 0 12px}.hint{color:#777;font-size:12px;line-height:1.5}.adminrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}footer{text-align:center;color:#888;font-size:11px;padding:15px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{margin:12px 12px 0}.pic{height:135px}}@media(max-width:390px){.brand{font-size:16px}.icon{padding:9px}.grid{gap:9px}.info{padding:10px}.price{font-size:16px}.btn{padding:9px;font-size:12px}.pic{height:115px}}
</style></head><body>
<header class="top"><div class="row"><span class="mark">★</span><div class="brand">BRAWL STARS<small>MARKET</small></div></div><div class="actions"><button class="icon" onclick="showPage('cart')">🛒 <b id="cartCount">0</b></button><button class="icon" onclick="showPage('profile')">♙</button></div></header>
<section class="hero"><div><div class="tag">МАГАЗИН ИГРОВЫХ АКСЕССУАРОВ</div><h1>ИГРАЙ.<br>СОЗДАВАЙ.<br>ПОБЕЖДАЙ.</h1><p>Аксессуары для игрового настроения: коврики, держатели, чехлы и другие полезные вещи.</p><button class="btn gold" onclick="document.getElementById('catalog').scrollIntoView()">Открыть каталог ↓</button></div><div class="hero-art">🎮</div></section>
<main class="wrap" id="catalog"><div class="head"><h2>Каталог товаров</h2><div class="tools"><input class="field search" id="search" placeholder="Найти товар..."><select class="field" id="sort"><option value="default">Сначала популярные</option><option value="asc">Сначала дешевле</option><option value="desc">Сначала дороже</option></select></div></div><div class="filters" id="filters"><button class="chip active" data-cat="Все">Все товары</button><button class="chip" data-cat="Аксессуары">Аксессуары</button><button class="chip" data-cat="Для телефона">Для телефона</button><button class="chip" data-cat="Для ПК">Для ПК</button><button class="chip" data-cat="Коллекция">Коллекция</button></div><div class="grid" id="products"></div>
<section id="page" class="panel" hidden></section></main>
<footer>BRAWL STARS MARKET — независимый демонстрационный магазин. Не связан с Supercell.</footer>
<nav class="bottom"><button class="active" onclick="showPage('catalog',this)">⌂ Каталог</button><button onclick="showPage('cart',this)">🛒 Корзина</button><button onclick="showPage('profile',this)">♙ Профиль</button><button onclick="showPage('admin',this)">⚙ Управление</button></nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="dialog" id="dialog"></div></div>
<script>
const defaults=[
{id:1,name:'Игровой коврик XL',cat:'Для ПК',price:1490,emoji:'🖱️',c1:'#f8e8b2',c2:'#e8e8e8',desc:'Большой коврик для мыши и клавиатуры.'},
{id:2,name:'Подставка для телефона',cat:'Для телефона',price:790,emoji:'📱',c1:'#e8edff',c2:'#f5f5f5',desc:'Удобная настольная подставка.'},
{id:3,name:'Игровые наушники',cat:'Аксессуары',price:3290,emoji:'🎧',c1:'#e8e8e8',c2:'#d8d8d8',desc:'Наушники для игр и общения.'},
{id:4,name:'Брелок-звезда',cat:'Коллекция',price:390,emoji:'⭐',c1:'#fff1b8',c2:'#ffe6e6',desc:'Небольшой тематический аксессуар.'},
{id:5,name:'Чехол для смартфона',cat:'Для телефона',price:990,emoji:'📲',c1:'#e8f7ee',c2:'#e9edff',desc:'Защитный чехол универсального дизайна.'},
{id:6,name:'Механическая клавиатура',cat:'Для ПК',price:4590,emoji:'⌨️',c1:'#f1e7ff',c2:'#e4e4e4',desc:'Компактная клавиатура для рабочего места.'},
{id:7,name:'Настольная LED-лампа',cat:'Аксессуары',price:1190,emoji:'💡',c1:'#fff0d9',c2:'#fff9e9',desc:'Мягкая подсветка игрового стола.'},
{id:8,name:'Коллекционная фигурка',cat:'Коллекция',price:1790,emoji:'🧸',c1:'#ffe8e8',c2:'#f3eaff',desc:'Декоративная фигурка для коллекции.'}
];
let products=JSON.parse(localStorage.getItem('bm_products')||'null')||defaults;let cart=JSON.parse(localStorage.getItem('bm_cart')||'{}');let orders=JSON.parse(localStorage.getItem('bm_orders')||'[]');let category='Все';
const money=n=>n.toLocaleString('ru-RU')+' ₽';const save=()=>{localStorage.setItem('bm_products',JSON.stringify(products));localStorage.setItem('bm_cart',JSON.stringify(cart));localStorage.setItem('bm_orders',JSON.stringify(orders));};
function render(){let q=document.getElementById('search').value.toLowerCase(),s=document.getElementById('sort').value;let list=products.filter(p=>(category==='Все'||p.cat===category)&&(p.name.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)));if(s==='asc')list.sort((a,b)=>a.price-b.price);if(s==='desc')list.sort((a,b)=>b.price-a.price);document.getElementById('products').innerHTML=list.length?list.map(p=>`<article class="card"><div class="pic" style="--c1:${p.c1};--c2:${p.c2};background:linear-gradient(145deg,${p.c1},${p.c2})">${p.emoji}</div><div class="info"><div class="kind">${p.cat}</div><h3>${escapeHtml(p.name)}</h3><div class="buyrow"><span class="price">${money(p.price)}</span><button class="btn" onclick="addCart(${p.id})">В корзину</button></div></div></article>`).join(''):'<div class="empty">Товары не найдены.</div>';updateCount();}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function updateCount(){document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}function addCart(id){cart[id]=(cart[id]||0)+1;save();updateCount();toast('Товар добавлен в корзину');}
function toast(t){let n=document.createElement('div');n.textContent=t;n.style='position:fixed;top:82px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:12px;z-index:20';document.body.append(n);setTimeout(()=>n.remove(),1700)}
function showPage(name,btn){document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');let p=document.getElementById('page');p.hidden=false;document.getElementById('products').hidden=name!=='catalog';document.getElementById('filters').hidden=name!=='catalog';document.querySelector('.head').hidden=name!=='catalog';if(name==='catalog'){p.hidden=true;document.getElementById('catalog').scrollIntoView({behavior:'smooth'});return}if(name==='cart')renderCart();if(name==='profile')renderProfile();if(name==='admin')renderAdmin();p.scrollIntoView({behavior:'smooth'});}
function renderCart(){let p=document.getElementById('page'),ids=Object.keys(cart).filter(id=>cart[id]>0),sum=0;p.innerHTML='<h3>Корзина</h3>'+ (ids.length?ids.map(id=>{let x=products.find(p=>p.id==id);if(!x)return '';sum+=x.price*cart[id];return `<div class="cartline"><div><b>${escapeHtml(x.name)}</b><div class="hint">${money(x.price)} за шт.</div></div><div class="qty"><button onclick="changeQty(${id},-1)">−</button>${cart[id]}<button onclick="changeQty(${id},1)">+</button></div><b>${money(x.price*cart[id])}</b></div>`}).join('')+`<div class="row" style="justify-content:space-between;margin-top:15px"><b>Итого: ${money(sum)}</b><button class="btn gold" onclick="checkout()">Оформить заявку</button></div>`:'<p class="hint">Корзина пока пуста.</p>')+'<p class="hint">Пока это локальная версия: заявка сохранится только в этом браузере. Онлайн-оплата и отправка заказа ещё не подключены.</p>';}
function changeQty(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();renderCart();updateCount()}
function checkout(){if(!Object.keys(cart).length)return;openModal(`<h3>Оформление заявки</h3><p class="hint">Заполни контактные данные. Не вводи данные банковской карты.</p><form onsubmit="submitOrder(event)"><label>Имя</label><input class="field" name="name" required maxlength="60"><label>Контакт для связи</label><input class="field" name="contact" required maxlength="100" placeholder="Например, email"><label>Комментарий</label><textarea class="field" name="note" rows="3" maxlength="300"></textarea><button class="btn gold" type="submit">Отправить заявку</button></form>`)}
function submitOrder(e){e.preventDefault();let f=new FormData(e.target);orders.unshift({id:Date.now(),date:new Date().toLocaleString('ru-RU'),name:f.get('name'),contact:f.get('contact'),note:f.get('note'),items:{...cart},status:'Новая'});cart={};save();closeModal();showPage('profile');toast('Заявка сохранена на этом устройстве');}
function renderProfile(){let p=document.getElementById('page');p.innerHTML='<h3>Личный кабинет</h3><p class="hint">Это профиль на текущем устройстве. Регистрация и вход через сервер пока не настроены.</p><h4>Мои заявки</h4>'+(orders.length?orders.map(o=>`<div class="orderline"><div><b>Заявка №${o.id}</b><div class="hint">${o.date} · ${escapeHtml(o.contact)}</div></div><span>${o.status}</span></div>`).join(''):'<p class="hint">Заявок пока нет.</p>')}
function renderAdmin(){let p=document.getElementById('page');p.innerHTML='<h3>Управление магазином</h3><p class="hint">Демо-панель без защищённого входа. Изменения хранятся только в этом браузере. Перед публикацией подключим серверную авторизацию и базу данных.</p><button class="btn gold" onclick="addProductForm()">＋ Добавить товар</button><h4>Товары</h4>'+products.map(x=>`<div class="adminrow"><span>${escapeHtml(x.name)} · ${money(x.price)}</span><button class="btn light" onclick="editProduct(${x.id})">Изменить</button><button class="btn light" onclick="deleteProduct(${x.id})">Удалить</button></div>`).join('')+'<h4>Заявки покупателей</h4>'+(orders.length?orders.map(o=>`<div class="orderline"><div><b>${escapeHtml(o.name)} — №${o.id}</b><div class="hint">${escapeHtml(o.contact)} · ${o.date}</div></div><select class="field" onchange="setStatus(${o.id},this.value)"><option ${o.status==='Новая'?'selected':''}>Новая</option><option ${o.status==='В обработке'?'selected':''}>В обработке</option><option ${o.status==='Закрыта'?'selected':''}>Закрыта</option></select></div>`).join(''):'<p class="hint">Заявок ещё нет.</p>');}
function addProductForm(){productForm()}function editProduct(id){productForm(products.find(x=>x.id===id))}function productForm(x={}){openModal(`<h3>${x.id?'Изменить':'Новый'} товар</h3><form onsubmit="saveProduct(event,${x.id||0})"><label>Название</label><input class="field" name="name" required value="${escapeHtml(x.name||'')}"><label>Категория</label><select class="field" name="cat"><option>Аксессуары</option><option>Для телефона</option><option>Для ПК</option><option>Коллекция</option></select><label>Цена, ₽</label><input class="field" name="price" type="number" min="1" required value="${x.price||''}"><label>Эмодзи-изображение</label><input class="field" name="emoji" maxlength="8" value="${x.emoji||'🎮'}"><button class="btn gold" type="submit">Сохранить</button></form>`);if(x.cat)document.querySelector('#dialog select[name=cat]').value=x.cat;}
function saveProduct(e,id){e.preventDefault();let f=new FormData(e.target),obj={id:id||Date.now(),name:f.get('name'),cat:f.get('cat'),price:Number(f.get('price')),emoji:f.get('emoji')||'🎮',c1:'#fff0c2',c2:'#eee'};if(id)products=products.map(x=>x.id===id?{...x,...obj}:x);else products.push(obj);save();closeModal();render();renderAdmin();toast('Товар сохранён');}
function deleteProduct(id){if(!confirm('Удалить товар из каталога?'))return;products=products.filter(x=>x.id!==id);delete cart[id];save();render();renderAdmin();}function setStatus(id,status){let o=orders.find(x=>x.id===id);if(o)o.status=status;save();}
function openModal(html){document.getElementById('dialog').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('search').addEventListener('input',render);document.getElementById('sort').addEventListener('change',render);document.getElementById('filters').addEventListener('click',e=>{let b=e.target.closest('[data-cat]');if(!b)return;category=b.dataset.cat;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});render();
</script></body></html>
